name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/version.json'
      - 'build/version.props'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      skip_publish:
        type: boolean
        default: false
jobs:
  ci:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-merge-publish.yml@main
    secrets: inherit
    with:
      skip_publish: ${{ inputs.skip_publish == true }}
    permissions:
      contents: read
      packages: write
      id-token: write

  nuget:
    needs: ci
    if: needs.ci.outputs.run_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: frankhaugen
      - uses: Novolis-Platform/novolis-workflows/actions/publish-nuget-org@main
        with:
          api_key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
